<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px 16px;
            text-align: left;
        }
        th {
            background-color: yellow;
            color: black;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th>Заголовок 1</th>
        <td>Ячейка 1</td>
        <td>Ячейка 2</td>
    </tr>
    <tr>
        <th>Заголовок 2</th>
        <td>Ячейка 3</td>
        <td>Ячейка 4</td>
    </tr>
</table>

</body>
</html>
