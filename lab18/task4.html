<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: Arial, sans-serif;
            font-size: 14px;
        }
        th, td {
            border: 1px solid #000;
            padding: 8px 16px;
            text-align: center;
        }
        th {
            background-color: #f0f0f0;
        }
        td:first-child {
            text-align: left;
            font-weight: bold;
        }
    </style>
</head>
<body>

<table>
    <tr>
        <th></th>
        <th>2013</th>
        <th>2014</th>
        <th>2015</th>
    </tr>
    <tr>
        <td>Нефть</td>
        <td>43</td>
        <td>51</td>
        <td>79</td>
    </tr>
    <tr>
        <td>Золото</td>
        <td>29</td>
        <td>34</td>
        <td>48</td>
    </tr>
    <tr>
        <td>Дерево</td>
        <td>38</td>
        <td>57</td>
        <td>36</td>
    </tr>
</table>

</body>
</html>
