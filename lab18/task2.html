<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблицы</title>
    <style>
        table {
            font-family: Arial, sans-serif;
            font-size: 14px;
            margin-bottom: 20px;
        }
        th, td {
            padding: 6px 12px;
        }
        .collapse {
            border-collapse: collapse;
        }
        .collapse th, .collapse td {
            border: 1px solid #000;
        }
        .separate {
            border-collapse: separate;
            border-spacing: 2px;
        }
        .separate th, .separate td {
            border: 1px solid #000;
        }
    </style>
</head>
<body>

<p><strong>Collapse</strong></p>
<table class="collapse">
    <tr>
        <th>Модель</th>
        <th>Производитель</th>
        <th>Цена</th>
    </tr>
    <tr>
        <td>Lumia 950</td>
        <td>Microsoft</td>
        <td>29900</td>
    </tr>
    <tr>
        <td>iPhone 6S</td>
        <td>Apple</td>
        <td>52900</td>
    </tr>
    <tr>
        <td>Nexus 6P</td>
        <td>Huawei</td>
        <td>49000</td>
    </tr>
</table>

<p><strong>Separate</strong></p>
<table class="separate">
    <tr>
        <th>Модель</th>
        <th>Производитель</th>
        <th>Цена</th>
    </tr>
    <tr>
        <td>G 5</td>
        <td>LG</td>
        <td>44900</td>
    </tr>
    <tr>
        <td>HTC 10</td>
        <td>HTC</td>
        <td>49900</td>
    </tr>
    <tr>
        <td>Nexus 5X</td>
        <td>Google/LG</td>
        <td>25000</td>
    </tr>
</table>

</body>
</html>
