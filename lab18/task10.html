<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Таблица сотрудников</title>
    <style>
        table {
            border-collapse: collapse;
            font-family: 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
            font-size: 14px;
            width: 70%;
        }
        th, td {
            border: 1px solid #6678b1;
            padding: 8px 12px;
            text-align: left;
        }
        th {
            color: #039;
            background-color: #f0f0f0;
        }
        td {
            color: #669;
        }
        tr:hover td {
            color: #6699ff;
        }
    </style>
</head>
<body>


<table>
    <thead>
        <tr>
            <th>Employee</th>
            <th>Salary</th>
            <th>Bonus</th>
            <th>Supervisor</th>
        </tr>
    </thead>
    <tbody>
        <tr>
            <td>Stephen C. Cox</td>
            <td>$300</td>
            <td>$50</td>
            <td>Bob</td>
        </tr>
        <tr>
            <td>Josephin Tan</td>
            <td>$150</td>
            <td>-</td>
            <td>Annie</td>
        </tr>
        <tr>
            <td>Joyce Ming</td>
            <td>$200</td>
            <td>$35</td>
            <td>Andy</td>
        </tr>
        <tr>
            <td>James A. Pentel</td>
            <td>$175</td>
            <td>$25</td>
            <td>Annie</td>
        </tr>
    </tbody>
</table>

</body>
</html>
