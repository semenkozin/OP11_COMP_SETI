<!DOCTYPE HTML>
<html>
<head>
<meta charset="utf-8">
<title>Селекторы в CSS3 </title>
<style>
:checked + span{
    color: red;
    font-size: bold;
}
</style>
</head>
<body>
<p><input type="checkbox" checked name="html15"/><span>HTML5</span></p>
<p><input type="checkbox" checked name="dotnet"/><span><div class="NET"></div></span></p>
<p><input type="checkbox" checked name="java"/><span>java</span></p>
<h2>Укажите пол</h2>
<p><input type="radio" value="man" checked name="gender"/><span>мужской</span></p>
<p><input type="radio" value="woman" checked name="gender"/><span> женский</span></p>

</body>
</html>
