<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Left padding</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .block1, .block2 {
            border: 2px solid red;
            width: 300px;
            padding-top: 10px;
            padding-bottom: 10px;
            margin-bottom: 10px;
        }
        .block1 {
            padding-left: 2cm;
        }
        .block2 {
            padding-left: 50%;
        }
    </style>
</head>
<body>

<div class="block1">
    В данном блоке поле слева равно 2см.
</div>

<div class="block2">
    В данном блоке поле слева 50%.
</div>

</body>
</html>
