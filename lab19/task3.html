<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Полупрозрачные блоки</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: white;
        }
        .box {
            background-color: green;
            color: white;
            padding: 15px 20px;
            margin: 10px 0;
            width: 300px;
        }
        .op1 { opacity: 0.1; }
        .op2 { opacity: 0.3; }
        .op3 { opacity: 0.6; }
        .op4 { opacity: 1; }
    </style>
</head>
<body>

<h1>Полупрозрачные блоки</h1>

<div class="box op1">opacity 0.1</div>
<div class="box op2">opacity 0.3</div>
<div class="box op3">opacity 0.6</div>
<div class="box op4">opacity 1 (default)</div>

</body>
</html>
