<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Right padding</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        .block1 {
            border: 2px solid red;
            width: 400px;
            padding-right: 2cm;
            padding-top: 10px;
            padding-bottom: 10px;
            margin-bottom: 20px;
            text-align: left;
        }
        .block2 {
            border: 2px solid red;
            width: 400px;
            padding-right: 50%;
            padding-top: 10px;
            padding-bottom: 10px;
            text-align: left;
        }
    </style>
</head>
<body>

<div class="block1">
    У данного текста внутренний отступ справа 2 см. У данного текста внутренний отступ справа 2 см. У данного текста внутренний отступ справа 2 см.
</div>

<div class="block2">
    У данного текста внутренний отступ справа 50%. У данного текста внутренний отступ справа 50%. У данного текста внутренний отступ справа 50%.
</div>

</body>
</html>
