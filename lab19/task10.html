<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Border radius examples</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }
        .box {
            width: 300px;
            padding: 20px;
            margin: 15px 0;
            background-color: #009999;
            color: white;
            text-align: center;
            font-weight: bold;
        }
        .box1 {
            border-radius: 50px 0 0 50px;
        }
        .box2 {
            border-radius: 40px 10px;
        }
        .box3 {
            border-radius: 13em/3em;
        }
        .box4 {
            border-radius: 13em 0.5em/1em 0.5em;
        }
        .box5 {
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="box box1">
    border-radius: 50px 0 0 50px;
</div>

<div class="box box2">
    border-radius: 40px 10px;
</div>

<div class="box box3">
    border-radius: 13em/3em;
</div>

<div class="box box4">
    border-radius: 13em 0.5em/1em 0.5em;
</div>

<div class="box box5">
    border-radius: 8px;
</div>

</body>
</html>
