<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Использование отступов</title>
    <style>
        .block {
            background-color: #2a58ea;
            color: white;
            padding-top: 100px;
            padding-right: 150px;
            padding-bottom: 100px;
            padding-left: 80px;
            font-family: 'Lucida Sans Unicode', 'Lucida Grande', sans-serif;
            font-size: 16px;
            margin-bottom: 50px;
        }
    </style>
</head>
<body>

<div class="block">
    Данный компонент имеет отступ сверху 100px, отступ справа 150px, отступ снизу 100px и отступ слева 80px.
</div>



</body>
</html>
